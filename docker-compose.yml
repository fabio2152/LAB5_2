services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketing}
      POSTGRES_USER: ${DB_USER:-marketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketing}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: marketing-ai:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marketing}
      DB_USER: ${DB_USER:-marketing}
      DB_PASSWORD: ${DB_PASSWORD:-marketing}
      STORAGE_DIR: /app/data/media
    volumes:
      - media-data:/app/data/media

volumes:
  db-data:
  media-data:
